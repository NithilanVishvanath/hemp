# HEMP evaluation plan. Edit it freely, then check your edits with:
#   hemp validate prompt.plan.yaml
#
# `hemp metrics` lists every check and its settings.

columns:
  input: [review]
  answer: label

checks:  # automatic, no LLM needed
- check: non_empty
  why: every prompt should produce some output
- check: allowed_values
  values: [negative, positive, neutral]
  why: outputs should be one of the labels in label
- check: exact_match
  compare_to: label
  why: outputs should match label exactly

questions: []  # yes/no questions for an LLM judge, e.g.
#  - id: q1
#    ask: Is the answer polite?

baselines:  # simple strategies your prompt should beat
  - majority_class  # always answer the most common label
  - zero_shot  # the input with no instructions

