[project]
name = "hemp-eval"
version = "0.1.0"
description = "HEMP (Help Evaluate My Prompt): figure out how a prompt should be evaluated, given the prompt and a dataset."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "NithilanVishvanath", email = "nithilanvishvanath@gmail.com" }
]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "dspy>=3.4.1",
    "litellm>=1.106.6",
    "pydantic>=2.6",
    "pyyaml>=6.0.3",
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
hemp = "hemp.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hemp"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-m", "not integration"]
markers = [
    "integration: tests that call a real model (run with `uv run pytest -m integration`)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# dspy and litellm ship without type information.
module = ["dspy", "dspy.*", "litellm", "litellm.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# DSPy signatures and modules are declared by subclassing dspy classes.
module = ["hemp.plan.planner"]
disallow_subclassing_any = false
